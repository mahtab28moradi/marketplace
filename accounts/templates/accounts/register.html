
{% extends 'base.html' %}

{% block title %}Register - Marketplace{% endblock %}

{% block content %}

<style>
    .auth-wrapper {
        max-width: 480px;
        margin: 40px auto;
    }

    .auth-card {
        background: white;
        padding: 35px;
        border-radius: 14px;
        box-shadow: 0 3px 18px rgba(0,0,0,0.06);
    }

    .auth-card h1 {
        color: #3157d5;
        text-align: center;
        margin-top: 0;
    }

    .auth-description {
        text-align: center;
        color: #6b7280;
        margin-bottom: 25px;
    }

    .auth-card form p {
        margin-bottom: 18px;
    }

    .auth-card form label {
        display: block;
        font-weight: 600;
        margin-bottom: 7px;
        color: #374151;
    }

    .auth-card form input {
        width: 100%;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 14px;
    }

    .auth-card form input:focus {
        outline: none;
        border-color: #3157d5;
    }

    .auth-card .helptext {
        display: block;
        color: #6b7280;
        font-size: 12px;
        margin-top: 6px;
        line-height: 1.5;
    }

    .auth-card .errorlist {
        color: #dc2626;
        font-size: 13px;
        padding-left: 20px;
    }

    .auth-button {
        width: 100%;
        padding: 13px;
        background: #3157d5;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
    }

    .auth-button:hover {
        background: #2444b5;
    }

    .auth-footer {
        text-align: center;
        margin-top: 25px;
        color: #6b7280;
    }

    .auth-footer a {
        color: #3157d5;
        font-weight: 600;
        text-decoration: none;
    }
</style>

<div class="auth-wrapper">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p class="auth-description">
            Join our marketplace and start buying and selling products.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="auth-button">
                Create Account
            </button>
        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </div>

    </div>

</div>

{% endblock %}
